kind = "web"
previewPath = "/"
title = "Personal Website & Resume"
description = "A responsive personal portfolio and resume website with professional profile, experience, selected work, skills, and contact details."
version = "1.0.0"
id = "artifacts/personal-resume"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24010

[services.development]
run = "pnpm --filter @workspace/personal-resume run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-resume", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-resume/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24010"
BASE_PATH = "/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resume
    description: Résumé actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /resume/print-access:
    post:
      operationId: verifyResumePrintAccess
      tags: [resume]
      summary: Verify permission to print the résumé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumePrintPasswordInput"
      responses:
        "200":
          description: Password accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumePrintAccess"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumePrintError"
        "401":
          description: Password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumePrintError"
        "503":
          description: Print password is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumePrintError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ResumePrintPasswordInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
        - password
    ResumePrintAccess:
      type: object
      properties:
        authorized:
          type: boolean
      required:
        - authorized
    ResumePrintError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

